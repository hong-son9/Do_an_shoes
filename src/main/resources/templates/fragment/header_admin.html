<th:block th:fragment="header">
<header class="header">
    <div class="logo-container">
        <a href="/admin" class="logo">
            <img th:src="@{/shop/images/slider/logo2.jpg}" width="75" height="35" alt="Porto Admin"/>
        </a>
    </div>

    <div class="header-right">
        <!-- Notification bell — auto poll /api/admin/orders/recent moi 10s, render don gan day,
             so sanh voi state cu de detect don MOI → badge + sound + toast. -->
        <div class="header-notifications">
            <button type="button" class="notif-btn" id="admNotifBtn" data-tooltip="Thông báo" aria-label="Thông báo">
                <i class="fas fa-bell"></i>
                <span class="notif-badge" id="admNotifBadge" style="display:none;">0</span>
            </button>
            <div class="dropdown-menu" id="admNotifMenu" style="display:none; position:absolute; right:0; top:50px; min-width:380px; max-height:480px; overflow:auto; background:#fff; border-radius:12px; box-shadow:0 16px 40px rgba(0,0,0,0.18); padding:10px; z-index:9999;">
                <div style="padding:10px 14px; font-weight:700; color:#1f2a37; border-bottom:1px solid #eef1f5; display:flex; justify-content:space-between; align-items:center;">
                    <span><i class="fas fa-bell" style="color:#ff6b35;"></i> Thông báo đơn hàng</span>
                    <a href="/admin/orders" style="font-size:0.78rem; color:#6b7280; font-weight:600;">Xem tất cả →</a>
                </div>
                <ul class="activity-list" id="admNotifList" style="padding:8px 4px;">
                    <li><span class="act-dot"><i class="fas fa-spinner fa-spin"></i></span>Đang tải...</li>
                </ul>
            </div>
        </div>
        <span class="separator"></span>
        <div id="userbox" class="userbox">
            <a href="#" data-toggle="dropdown">
                <figure class="profile-picture">
                    <img th:src="@{/shop/images/avatar/avatar7.png}" alt="Joseph Doe" class="rounded-circle"
                         data-lock-picture="img/%21logged-user.jpg"/>
                </figure>
                <div class="profile-info" >
                    <span class="name">[[${#httpServletRequest.remoteUser}]]</span>
                    <span class="role">Administrator</span>
                </div>
                <i class="fa custom-caret"></i>
            </a>
            <div class="dropdown-menu">
                <ul class="list-unstyled mb-2">
                    <li class="divider"></li>
                    <li>
                        <a role="menuitem" tabindex="-1" href="/tai-khoan"><i
                                class="bx bx-user-circle"></i>Thông tin tài khoản</a>
                    </li>
                    <li>
                        <a role="menuitem" tabindex="-1" href="/api/logout"><i class="bx bx-power-off"></i> Đăng xuất</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

</header>

<script>
    // ============================================================
    // ADMIN notification bell — auto poll recent orders every 10s
    // Render real order info (buyer name + product + thoi gian).
    // Badge = so don MOI ke tu lan click cuoi.
    // ============================================================
    (function () {
        var btn = document.getElementById('admNotifBtn');
        var menu = document.getElementById('admNotifMenu');
        var badge = document.getElementById('admNotifBadge');
        var list = document.getElementById('admNotifList');
        if (!btn || !menu || !badge || !list) return;

        var STATUS_TEXT = {1:'⏳ Chờ lấy hàng', 2:'🚚 Đang giao', 3:'✅ Đã giao', 4:'↩️ Đã trả lại', 5:'❌ Đã hủy'};
        var STATUS_CLASS = {1:'s-warning', 2:'s-info', 3:'s-success', 4:'s-muted', 5:'s-danger'};

        function timeAgo(ms) {
            var sec = Math.floor((Date.now() - ms) / 1000);
            if (sec < 60) return 'vừa xong';
            if (sec < 3600) return Math.floor(sec / 60) + ' phút trước';
            if (sec < 86400) return Math.floor(sec / 3600) + ' giờ trước';
            return Math.floor(sec / 86400) + ' ngày trước';
        }

        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            menu.style.display = menu.style.display === 'none' || !menu.style.display ? 'block' : 'none';
            // Khi mo notif → reset badge va luu lastSeenId
            badge.style.display = 'none';
            var current = JSON.parse(localStorage.getItem('adm_recent_orders') || '[]');
            if (current.length > 0) {
                localStorage.setItem('adm_last_seen_order_id', String(current[0].id));
            }
        });
        document.addEventListener('click', function (e) {
            if (!menu.contains(e.target) && !btn.contains(e.target)) menu.style.display = 'none';
        });

        function render(orders) {
            if (!orders || orders.length === 0) {
                list.innerHTML = '<li><span class="act-dot"><i class="fas fa-inbox"></i></span>Chưa có đơn hàng nào<div class="act-meta">Khi có khách đặt hàng, thông báo sẽ xuất hiện ở đây</div></li>';
                return;
            }
            var lastSeenId = parseInt(localStorage.getItem('adm_last_seen_order_id') || '0', 10);
            var html = '';
            orders.forEach(function (o) {
                var isNew = o.id > lastSeenId;
                var stClass = STATUS_CLASS[o.status] || 's-muted';
                var stText = STATUS_TEXT[o.status] || ('Status ' + o.status);
                html += '<li onclick="window.location.href=\'/admin/orders\'" style="cursor:pointer; padding-left:48px;' + (isNew ? 'background:#fff5ed; border-left:3px solid #ff6b35;' : '') + '">'
                     + '<span class="act-dot" style="background:' + (isNew ? '#ff6b35' : '#94a3b8') + ';"><i class="fas fa-shopping-bag"></i></span>'
                     + '<div><strong>' + escapeHtml(o.buyerName) + '</strong> đã đặt '
                     + '<span style="color:#ff6b35; font-weight:600;">' + escapeHtml(o.productName) + '</span> '
                     + '(x' + o.quantity + ')</div>'
                     + '<div class="act-meta">'
                     + '<span class="status-dot ' + stClass + '" style="font-size:0.7rem; padding:2px 8px;">' + stText + '</span>'
                     + '<span style="margin-left:8px;">' + timeAgo(o.createdAt) + '</span>'
                     + '</div>'
                     + '</li>';
            });
            list.innerHTML = html;
        }
        function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

        function poll() {
            if (typeof fetch !== 'function') return;
            fetch('/api/admin/orders/recent').then(function (r) { return r.json(); }).then(function (orders) {
                orders = orders || [];
                var previousOrders = JSON.parse(localStorage.getItem('adm_recent_orders') || '[]');
                var lastSeenId = parseInt(localStorage.getItem('adm_last_seen_order_id') || '0', 10);

                // Count don MOI ke tu lan click cuoi
                var newCount = orders.filter(function (o) { return o.id > lastSeenId; }).length;
                if (newCount > 0) {
                    badge.textContent = newCount > 99 ? '99+' : newCount;
                    badge.style.display = 'inline-flex';
                }

                // Phat hien don MOI THAT (so voi snapshot poll truoc) → toast + sound
                var prevMaxId = previousOrders.length > 0 ? previousOrders[0].id : 0;
                var trulyNew = orders.filter(function (o) { return o.id > prevMaxId; });
                if (trulyNew.length > 0 && prevMaxId > 0) {
                    trulyNew.forEach(function (o) {
                        if (typeof toastr !== 'undefined') {
                            toastr.info('<strong>' + escapeHtml(o.buyerName) + '</strong> vừa đặt <strong>' + escapeHtml(o.productName) + '</strong>',
                                '🛒 Đơn mới!', { timeOut: 6000, closeButton: true, escapeHtml: false, onclick: function () { window.location.href = '/admin/orders'; } });
                        }
                        // Simple beep — Web Audio API
                        try {
                            var ctx = new (window.AudioContext || window.webkitAudioContext)();
                            var osc = ctx.createOscillator(); var gain = ctx.createGain();
                            osc.connect(gain); gain.connect(ctx.destination);
                            osc.frequency.value = 880; gain.gain.value = 0.08;
                            osc.start(); setTimeout(function () { osc.stop(); ctx.close(); }, 180);
                        } catch (e) { /* ignore */ }
                    });
                }

                localStorage.setItem('adm_recent_orders', JSON.stringify(orders));
                render(orders);
            }).catch(function () { /* ignore */ });
        }
        poll();
        setInterval(poll, 10000);  // 10s — nhanh hon truoc (30s)
    })();
</script>
</th:block>
