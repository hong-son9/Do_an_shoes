<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: main-fragment(
                                                                     ~{:: title},
                                                                    'header',
                                                                    'footer',
                                                                     ~{:: #css-resources},
                                                                     ~{:: #js-resources},
                                                                     ~{:: #main-content}
                                                                    )}">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <th:block id="css-resources">
        <link rel="stylesheet" th:href="@{/shop/css/custom.css}">
        <style>
            .cart-table img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; }
            .cart-table td { vertical-align: middle; }
            .qty-input { width: 70px; text-align: center; }
            .out-of-stock { color: #dc3545; font-size: 12px; }
            .payment-card {
                display: block;
                width: 100%;
                padding: 14px 16px;
                margin-bottom: 10px;
                border: 2px solid #ddd;
                border-radius: 10px;
                background: #fff;
                cursor: pointer;
                text-align: left;
                transition: all 0.15s ease-in-out;
            }
            .payment-card:hover { border-color: #1976d2; background: #f5faff; }
            .payment-card.active { border-color: #1976d2; background: #e3f2fd; box-shadow: 0 0 0 1px #1976d2 inset; }
            .payment-card input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
            .payment-card .pm-title { font-weight: 600; }
            .payment-card .pm-desc { font-size: 12px; color: #6c757d; margin-top: 2px; }
        </style>
    </th:block>
</head>
<body>
<main class="main" id="main-content">
    <nav aria-label="breadcrumb" class="breadcrumb-nav">
        <div class="container">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/"><i class="icon-home"></i></a></li>
                <li class="breadcrumb-item active" aria-current="page">Giỏ hàng</li>
            </ol>
        </div>
    </nav>

    <div class="container" style="margin-bottom: 40px;">
        <h2 style="margin-top: 20px;">Giỏ hàng (<span id="cart-item-count" th:text="${itemCount}">0</span>)</h2>

        <div th:if="${items.isEmpty()}" class="text-center" style="padding: 40px;">
            <h4>Giỏ hàng của bạn đang trống</h4>
            <a href="/san-pham" class="btn btn-primary" style="border-radius: 10px; margin-top: 15px;">Mua sắm ngay</a>
        </div>

        <div th:unless="${items.isEmpty()}" class="row">
            <div class="col-lg-8">
                <table class="table cart-table">
                    <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Size</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Tạm tính</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="cart-tbody">
                    <tr th:each="item : ${items}"
                        th:attr="data-item-id=${item.id},
                                 data-unit=${item.salePrice > 0 ? item.salePrice : item.price},
                                 data-product-id=${item.productId},
                                 data-size=${item.size}">
                        <td>
                            <div style="display:flex; align-items:center;">
                                <img th:src="${item.productImage}" th:alt="${item.productName}">
                                <div style="margin-left:12px;">
                                    <a th:href="@{/{slug}/{id}(id=${item.productId}, slug=${item.productSlug})}" th:text="${item.productName}" style="font-weight:500;"></a>
                                    <div th:unless="${item.inStock}" class="out-of-stock">Sản phẩm/size đã hết hoặc không đủ tồn</div>
                                    <div class="stock-warning" style="display:none; color:#dc3545; font-size:0.85rem; font-weight:600; margin-top:4px;"></div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${item.size}"></td>
                        <td>
                            <span class="item-unit" th:text="${#numbers.formatDecimal(item.salePrice > 0 ? item.salePrice : item.price, 0, 'COMMA', 0, 'POINT') + ' đ'}"></span>
                        </td>
                        <td>
                            <input type="number" min="1" class="form-control qty-input" th:value="${item.quantity}">
                            <small class="stock-hint" style="color:#6b7280; font-size:0.78rem;"></small>
                        </td>
                        <td>
                            <span class="item-subtotal" th:text="${#numbers.formatDecimal(item.subTotal, 0, 'COMMA', 0, 'POINT') + ' đ'}"></span>
                        </td>
                        <td>
                            <button type="button" class="btn btn-sm btn-link text-danger btn-remove">Xóa</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="col-lg-4">
                <div class="card" style="border-radius:10px;">
                    <div class="card-body">
                        <h5>Tổng đơn hàng</h5>
                        <hr>
                        <div style="display:flex; justify-content:space-between; margin-bottom: 12px;">
                            <span>Tạm tính</span>
                            <strong id="cart-subtotal" th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT') + ' đ'}"
                                   th:data-raw="${totalAmount}"></strong>
                        </div>

                        <!-- Coupon dropdown -->
                        <div style="margin: 14px 0 6px;">
                            <label for="cart-coupon" style="font-size: 0.92rem; color: #6b7280; font-weight: 600;">Mã khuyến mãi</label>
                            <select id="cart-coupon" class="form-control" style="border-radius: 8px;">
                                <th:block th:if="${promotions == null} or ${promotions.isEmpty()}">
                                    <option value="" data-empty="true">Không có khuyến mãi</option>
                                </th:block>
                                <th:block th:if="${promotions != null} and not ${promotions.isEmpty()}">
                                    <option value="">-- Không áp dụng --</option>
                                    <th:block th:each="p : ${promotions}">
                                        <option th:value="${p.couponCode}"
                                                th:data-type="${p.discountType}"
                                                th:data-value="${p.discountValue}"
                                                th:data-max="${p.maximumDiscountValue}"
                                                th:text="${p.discountType == 1
                                                    ? p.couponCode + ' — Giảm ' + p.discountValue + '%'
                                                    : p.couponCode + ' — Giảm ' + #numbers.formatDecimal(p.discountValue, 0, 'COMMA', 0, 'POINT') + 'đ/đôi'}">
                                        </option>
                                    </th:block>
                                </th:block>
                            </select>
                            <small id="coupon-message" style="display:none; font-size:0.85rem; margin-top:4px;"></small>
                        </div>

                        <div id="cart-discount-row" style="display:none; justify-content:space-between; margin-top: 10px; color: #ff6b35; font-weight: 600;">
                            <span>Giảm giá</span>
                            <span id="cart-discount">- 0 đ</span>
                        </div>

                        <hr>
                        <div style="display:flex; justify-content:space-between; font-size: 1.1rem;">
                            <strong>Thành tiền</strong>
                            <strong id="cart-final" style="color: #ff6b35;"
                                    th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT') + ' đ'}"></strong>
                        </div>

                        <button type="button" id="btn-checkout" class="btn btn-primary btn-block" style="border-radius:10px; margin-top:20px;">
                            Đặt hàng
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal nhap thong tin nhan hang + chon phuong thuc thanh toan -->
    <div class="modal fade" id="modal-cart-checkout" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
            <div class="modal-content" style="border-radius: 10px;">
                <div class="modal-header">
                    <h5 class="modal-title">Thông tin đặt hàng</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">
                    <form id="form-checkout">
                        <div class="form-group">
                            <label>Tên người nhận <span class="text-danger">*</span></label>
                            <input type="text" id="ck-name" class="form-control" th:value="${user_fullname}" style="border-radius: 10px;">
                        </div>
                        <div class="form-group">
                            <label>Số điện thoại <span class="text-danger">*</span></label>
                            <input type="text" id="ck-phone" class="form-control" th:value="${user_phone}" style="border-radius: 10px;">
                        </div>
                        <div class="form-group">
                            <label>Địa chỉ nhận hàng <span class="text-danger">*</span></label>
                            <textarea id="ck-address" class="form-control" style="border-radius: 10px;" th:text="${user_address}"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Ghi chú</label>
                            <textarea id="ck-note" class="form-control" style="border-radius: 10px;"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Phương thức thanh toán</label>
                            <label class="payment-card active" for="pm-cod">
                                <input type="radio" name="payment_method" id="pm-cod" value="cod" checked>
                                <span class="pm-title">Thanh toán trực tiếp (COD)</span>
                                <div class="pm-desc">Thanh toán khi nhận hàng tại nhà.</div>
                            </label>
                            <label class="payment-card" for="pm-vnpay">
                                <input type="radio" name="payment_method" id="pm-vnpay" value="vnpay">
                                <span class="pm-title">Thanh toán qua VNPay</span>
                                <div class="pm-desc">Thẻ ATM/Visa/Master/QR Pay (sandbox). Giỏ hàng chỉ bị xóa sau khi thanh toán thành công.</div>
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" style="border-radius:10px;">Hủy</button>
                    <button type="button" class="btn btn-primary" id="btn-confirm-checkout" style="border-radius:10px;">Xác nhận đặt hàng</button>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block id="js-resources">
    <script th:inline="javascript">
        function formatMoney(n) {
            return Number(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + ' đ';
        }

        // ===== STOCK VALIDATION =====
        // Cache: { productId: { size: quantityInStock } }
        const stockMap = {};

        function fetchStockForCart() {
            // Lay danh sach unique productId trong cart
            let productIds = new Set();
            $('#cart-tbody tr').each(function() {
                let pid = $(this).attr('data-product-id');
                if (pid) productIds.add(pid);
            });

            // Fetch song song
            let pending = productIds.size;
            if (pending === 0) {
                validateAllStock();
                return;
            }
            productIds.forEach(function(pid) {
                $.ajax({
                    url: '/api/products/' + encodeURIComponent(pid) + '/stock-by-size',
                    type: 'GET',
                    success: function(data) { stockMap[pid] = data || {}; },
                    error: function() { stockMap[pid] = {}; },
                    complete: function() {
                        pending--;
                        if (pending === 0) validateAllStock();
                    }
                });
            });
        }

        function validateAllStock() {
            let hasError = false;
            $('#cart-tbody tr').each(function() {
                let $row = $(this);
                let pid = $row.attr('data-product-id');
                let size = parseInt($row.attr('data-size'), 10);
                let qty = parseInt($row.find('.qty-input').val(), 10) || 1;
                let stock = (stockMap[pid] && stockMap[pid][size] != null) ? parseInt(stockMap[pid][size]) : null;

                let $hint = $row.find('.stock-hint');
                let $warn = $row.find('.stock-warning');
                let $input = $row.find('.qty-input');

                if (stock != null) {
                    $hint.text('Còn ' + stock + ' đôi');
                } else {
                    $hint.text('');
                }

                if (stock != null && qty > stock) {
                    $warn.text('Hết hàng — chỉ còn ' + stock + ' đôi').show();
                    $input.css('border-color', '#dc3545');
                    hasError = true;
                } else {
                    $warn.hide();
                    $input.css('border-color', '');
                }
            });

            // Disable nut Đặt hàng neu co bat ky row nao vuot ton kho
            if (hasError) {
                $('#btn-checkout').prop('disabled', true).css({
                    'opacity': '0.55',
                    'cursor': 'not-allowed'
                }).attr('title', 'Có sản phẩm vượt số lượng tồn kho — vui lòng giảm bớt');
            } else {
                $('#btn-checkout').prop('disabled', false).css({
                    'opacity': '',
                    'cursor': ''
                }).removeAttr('title');
            }
            return !hasError;
        }

        // Tinh tong subtotal + tong so luong toan cart
        function computeCartTotals() {
            let total = 0;
            let totalQty = 0;
            $('#cart-tbody tr').each(function() {
                let unit = parseInt($(this).attr('data-unit'), 10) || 0;
                let qty = parseInt($(this).find('.qty-input').val(), 10) || 0;
                if (qty < 1) qty = 1;
                let sub = unit * qty;
                $(this).find('.item-subtotal').text(formatMoney(sub));
                total += sub;
                totalQty += qty;
            });
            return { subTotal: total, totalQty: totalQty };
        }

        // Tinh discount theo promotion duoc chon (per-unit)
        function computeDiscount(subTotal, totalQty) {
            let $opt = $('#cart-coupon').find('option:selected');
            if (!$opt.length || !$opt.val()) return { discount: 0, code: null };

            let type = parseInt($opt.attr('data-type'), 10);
            let value = parseFloat($opt.attr('data-value')) || 0;
            let max = parseFloat($opt.attr('data-max')) || 0;
            let discount = 0;

            if (type === 1) {
                // % giam: ap dung tren tong subTotal (per-unit khong khac)
                discount = Math.floor(subTotal * value / 100);
                if (max > 0 && discount > max) discount = max;
            } else if (type === 2) {
                // Fixed: GIAM x DONG / DOI → nhan voi tong so luong
                discount = value * totalQty;
                if (max > 0 && discount > max) discount = max;
            }
            if (discount > subTotal) discount = subTotal;
            if (discount < 0) discount = 0;
            return { discount: discount, code: $opt.val() };
        }

        function refreshTotals() {
            let { subTotal, totalQty } = computeCartTotals();
            $('#cart-subtotal').text(formatMoney(subTotal)).attr('data-raw', subTotal);

            let { discount, code } = computeDiscount(subTotal, totalQty);
            window.__appliedCoupon = code;
            window.__appliedDiscount = discount;

            if (discount > 0) {
                $('#cart-discount').text('- ' + formatMoney(discount));
                $('#cart-discount-row').css('display', 'flex');
            } else {
                $('#cart-discount-row').hide();
            }
            let finalAmount = subTotal - discount;
            if (finalAmount < 0) finalAmount = 0;
            $('#cart-final').text(formatMoney(finalAmount));
        }

        // Update lien tuc khi go (UI thay doi ngay, khong cho server) — UX truoc
        $(document).on('input', '.qty-input', function() {
            let qty = parseInt($(this).val(), 10);
            if (!qty || qty < 1) qty = 1;
            refreshTotals();
            showCouponMsg();
            validateAllStock();
        });

        // Cap nhat so luong len server khi blur/change
        $(document).on('change', '.qty-input', function() {
            let row = $(this).closest('tr');
            let itemId = row.attr('data-item-id');
            let qty = parseInt($(this).val(), 10);
            if (!qty || qty < 1) { qty = 1; $(this).val(1); }
            $.ajax({
                url: '/api/cart/items/' + itemId,
                type: 'PUT',
                data: JSON.stringify({ quantity: qty }),
                contentType: "application/json; charset=utf-8",
                success: function() {
                    refreshTotals();
                    showCouponMsg();
                    validateAllStock();
                    if (typeof toastr !== 'undefined') toastr.success("Đã cập nhật số lượng");
                },
                error: function(data) {
                    validateAllStock();
                    if (typeof toastr !== 'undefined') {
                        toastr.warning((data.responseJSON && data.responseJSON.message) || "Lỗi cập nhật");
                    }
                }
            });
        });

        // Xoa item
        $(document).on('click', '.btn-remove', function() {
            let row = $(this).closest('tr');
            let itemId = row.attr('data-item-id');
            if (!confirm('Xóa sản phẩm này khỏi giỏ hàng?')) return;
            $.ajax({
                url: '/api/cart/items/' + itemId,
                type: 'DELETE',
                success: function() {
                    row.remove();
                    toastr.success("Đã xóa khỏi giỏ hàng");
                    if ($('#cart-tbody tr').length == 0) {
                        location.reload();
                    } else {
                        refreshTotals();
                        let count = parseInt($('#cart-item-count').text(), 10) - 1;
                        $('#cart-item-count').text(count);
                        $('#cart-badge').text(count).toggle(count > 0);
                    }
                },
                error: function(data) {
                    toastr.warning((data.responseJSON && data.responseJSON.message) || "Lỗi xóa");
                }
            });
        });

        // Toggle active state cua card chon phuong thuc thanh toan
        $(document).on('change', 'input[name="payment_method"]', function() {
            $('.payment-card').removeClass('active');
            $(this).closest('.payment-card').addClass('active');
        });

        // ===== COUPON — auto apply on change + recompute on every quantity update =====
        function showCouponMsg() {
            let $sel = $('#cart-coupon');
            let $msg = $('#coupon-message');
            let $opt = $sel.find('option:selected');

            if (!$sel.find('option').length || $opt.attr('data-empty') === 'true') {
                $msg.text('Hiện không có khuyến mãi nào').css('color', '#6b7280').show();
                return;
            }
            if (!$opt.val()) {
                $msg.hide();
                return;
            }
            let d = window.__appliedDiscount || 0;
            if (d > 0) {
                $msg.text('✓ Đã áp dụng — giảm ' + formatMoney(d)).css('color', '#22c55e').show();
            } else {
                $msg.text('Mã được chọn nhưng không tạo ra giảm giá').css('color', '#6b7280').show();
            }
        }

        // Doi promotion → tinh lai ngay
        $('#cart-coupon').on('change', function() {
            refreshTotals();
            showCouponMsg();
        });

        // Auto-select promotion dau tien co value khi load
        (function autoApplyFirstPromotion() {
            let $sel = $('#cart-coupon');
            // Tim option dau tien co data-type (= 1 promotion thuc)
            let $first = $sel.find('option[data-type]').first();
            if ($first.length) {
                $sel.val($first.val());
            }
            refreshTotals();
            showCouponMsg();
        })();

        // Khi load → fetch ton kho cho moi san pham trong cart
        $(function() {
            fetchStockForCart();
        });

        // Mo modal dat hang
        $('#btn-checkout').click(function() {
            if ($('#cart-tbody tr').length == 0) {
                if (typeof toastr !== 'undefined') toastr.warning("Giỏ hàng trống");
                return;
            }
            // Re-check stock truoc khi mo modal
            if (!validateAllStock()) {
                if (typeof toastr !== 'undefined') {
                    toastr.warning("Một số sản phẩm vượt số lượng tồn kho. Vui lòng giảm bớt trước khi đặt hàng.");
                }
                return;
            }
            $('#modal-cart-checkout').modal('show');
        });

        // Xac nhan dat hang
        $('#btn-confirm-checkout').click(function() {
            let name = $('#ck-name').val().trim();
            let phone = $('#ck-phone').val().trim();
            let address = $('#ck-address').val().trim();
            let note = $('#ck-note').val();
            let paymentMethod = $('input[name="payment_method"]:checked').val();

            if (!name) { if (typeof toastr !== 'undefined') toastr.warning("Vui lòng nhập tên người nhận"); return; }
            let phoneRegex = /((09|03|07|08|05)+([0-9]{8})\b)/g;
            if (!phoneRegex.test(phone)) { if (typeof toastr !== 'undefined') toastr.warning("Số điện thoại không hợp lệ"); return; }
            if (!address) { if (typeof toastr !== 'undefined') toastr.warning("Vui lòng nhập địa chỉ"); return; }

            // Lay coupon hien tai dang chon trong dropdown
            let couponCode = window.__appliedCoupon || $('#cart-coupon').val() || null;
            if (couponCode === "") couponCode = null;

            let req = {
                receiver_name: name,
                receiver_phone: phone,
                receiver_address: address,
                note: note,
                payment_method: paymentMethod,
                coupon_code: couponCode
            };

            $('#btn-confirm-checkout').prop('disabled', true);
            $.ajax({
                url: '/api/cart/checkout',
                type: 'POST',
                data: JSON.stringify(req),
                contentType: "application/json; charset=utf-8",
                success: function(data) {
                    if (paymentMethod === 'vnpay' && data.paymentUrl) {
                        window.location.href = data.paymentUrl;
                    } else {
                        if (typeof notifySuccess === 'function') notifySuccess("Đặt hàng thành công");
                        else if (typeof toastr !== 'undefined') toastr.success("Đặt hàng thành công");
                        setTimeout(function() {
                            location.href = "/tai-khoan/lich-su-giao-dich";
                        }, 1200);
                    }
                },
                error: function(xhr) {
                    $('#btn-confirm-checkout').prop('disabled', false);
                    let msg = (xhr.responseJSON && xhr.responseJSON.message)
                        || (typeof parseAjaxError === 'function' ? parseAjaxError(xhr, 'Lỗi đặt hàng') : 'Lỗi đặt hàng');
                    if (typeof notifyError === 'function') notifyError(msg);
                    else if (typeof toastr !== 'undefined') toastr.warning(msg);
                    else alert(msg);
                }
            });
        });
    </script>
</th:block>
</body>
</html>
