<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{/layout/layout_admin :: main-fragment(
                                                ~{:: title},
                                                'header',
                                                'sidebar',
                                                ~{:: #css-resources},
                                                ~{:: #js-resources},
                                                ~{:: #main-content}
                                               )}">
<head>
    <meta charset="UTF-8">
    <title>Danh sách tài khoản</title>
    <th:block id="css-resources">
        <link rel="stylesheet" th:href="@{/adminlte/pagination/simplePagination.css}">
        <style>
            .status-badge {
                display: inline-block;
                padding: 4px 10px;
                border-radius: 12px;
                font-size: 12px;
                font-weight: 600;
            }
            .status-badge.active { background: #d1fae5; color: #065f46; }
            .status-badge.inactive { background: #fee2e2; color: #991b1b; }
            .btn-toggle-status {
                padding: 5px 12px;
                border-radius: 6px;
                font-size: 12px;
                font-weight: 500;
                border: none;
                cursor: pointer;
                transition: all 0.2s;
            }
            .btn-toggle-status.lock { background: #ef4444; color: white; }
            .btn-toggle-status.lock:hover { background: #dc2626; }
            .btn-toggle-status.unlock { background: #10b981; color: white; }
            .btn-toggle-status.unlock:hover { background: #059669; }
            .btn-toggle-status.promote { background: #ff6b35; color: white; }
            .btn-toggle-status.promote:hover { background: #e63946; }
            .btn-toggle-status.demote { background: #6b7280; color: white; }
            .btn-toggle-status.demote:hover { background: #374151; }
            .btn-toggle-status:disabled { background: #cbd5e1 !important; cursor: not-allowed; opacity: 0.6; }
        </style>
    </th:block>
</head>
<body>
<section role="main" class="content-body" id="main-content">
    <header class="page-header">
        <div class="right-wrapper text-right">
            <ol class="breadcrumbs">
                <li>
                    <a href="/admin">
                        <i class="bx bx-home-alt"></i>
                    </a>
                </li>
                <li><span>Danh sách tài khoản</span></li>
            </ol>
            <a class="sidebar-right-toggle" data-open="sidebar-right"><i
                    class="fas fa-chevron-left"></i></a>
        </div>
    </header>

    <section class="card panel">
        <header class="card-header panel-heading">
            <div class="card-actions">
                <a href="#" class="card-action card-action-toggle" data-card-toggle></a>
            </div>
            <h2 class="card-title panel-title"><i class="fas fa-users" style="color:#ff6b35; margin-right:8px;"></i> Danh sách tài khoản</h2>
        </header>

        <!-- Quick search + filter pills toolbar -->
        <div class="table-toolbar">
            <div class="table-search">
                <input type="text" id="quickSearchTable" placeholder="Tìm kiếm nhanh trong bảng (tên, email, SĐT)...">
            </div>
            <div class="filter-pills">
                <span class="filter-pill active" data-filter="all">Tất cả <span class="count" id="cntAll">0</span></span>
                <span class="filter-pill" data-filter="active">🟢 Hoạt động <span class="count" id="cntActive">0</span></span>
                <span class="filter-pill" data-filter="inactive">🔴 Đã khóa <span class="count" id="cntInactive">0</span></span>
                <span class="filter-pill" data-filter="admin">🛡 Admin <span class="count" id="cntAdmin">0</span></span>
            </div>
        </div>

        <div class="card-body">
            <table class="table table-bordered table-striped mb-0" id="datatable-editable">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Địa chỉ</th>
                    <th>Ngày tạo</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                <tr>
                    <form method="GET" id="search-form">
                        <th></th>
                        <th><input type="text" name="fullName" id="fullName" class="form-control search-input"></th>
                        <th><input type="text" name="email" id="email" class="form-control search-input"></th>
                        <th><input type="text" name="phone" id="phone" class="form-control search-input"></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                        <input type="hidden" name="page" id="page">
                    </form>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="user : ${users}">
                    <tr th:attr="data-user-id=${user.id}, data-is-admin=${user.roles != null and user.roles.contains('ADMIN')}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.fullName}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.phone}"></td>
                    <td th:text="${user.address}"></td>
                    <td th:text="${#dates.format(user.createdAt, 'dd-MM-yyyy')}"></td>
                    <td>
                        <span th:if="${user.status}" class="status-badge active">● Đang hoạt động</span>
                        <span th:unless="${user.status}" class="status-badge inactive">● Đã khóa</span>
                    </td>
                    <td style="white-space: nowrap;" th:with="isSelf=${user.id == user_id},isAdmin=${user.roles != null and user.roles.contains('ADMIN')}">
                        <!-- Neu la chinh tai khoan dang login → khong cho thao tac -->
                        <button th:if="${isSelf}"
                                class="btn-toggle-status" disabled
                                title="Đây là tài khoản đang đăng nhập, không thể tự thao tác">
                            <i class="fas fa-user-check"></i> Bạn
                        </button>

                        <!-- Khoa/Mo khoa: chi cho user thuong (khong phai self, khong phai admin) -->
                        <th:block th:unless="${isSelf}">
                            <button th:if="${isAdmin}"
                                    class="btn-toggle-status" disabled
                                    title="Cần thu hồi quyền admin trước khi khóa">
                                <i class="fas fa-shield-alt"></i> Admin
                            </button>
                            <button th:unless="${isAdmin}"
                                    th:classappend="${user.status} ? 'lock' : 'unlock'"
                                    th:attr="data-user-id=${user.id}, data-current-status=${user.status}"
                                    class="btn-toggle-status btn-toggle">
                                <i th:class="${user.status} ? 'fas fa-lock' : 'fas fa-unlock'"></i>
                                <span th:text="${user.status} ? 'Khóa' : 'Mở khóa'"></span>
                            </button>

                            <!-- Cap/Thu hoi quyen admin (cung an khi la self) -->
                            <button th:if="${isAdmin}"
                                    th:attr="data-user-id=${user.id}"
                                    class="btn-toggle-status btn-toggle-role demote"
                                    style="margin-left: 4px;"
                                    title="Thu hồi quyền quản trị viên">
                                <i class="fas fa-user-minus"></i> Thu hồi
                            </button>
                            <button th:unless="${isAdmin}"
                                    th:attr="data-user-id=${user.id}, data-status=${user.status}"
                                    class="btn-toggle-status btn-toggle-role promote"
                                    style="margin-left: 4px;"
                                    title="Cấp quyền quản trị viên">
                                <i class="fas fa-user-shield"></i> Cấp quyền
                            </button>
                        </th:block>
                    </td>
                </tr>
                </th:block>
                </tbody>
            </table>
            <br>
            <!-- Pagination -->
            <nav aria-label="Page navigation">
                <ul class="pagination" id="pagination"></ul>
            </nav>
        </div>
    </section>

</section>

<th:block id="js-resources">
    <script type="text/javascript" th:src="@{/adminlte/pagination/jquery.simplePagination.js}"></script>
    <script type="text/javascript" th:src="@{/adminlte/js/table.js}"></script>
    <script th:inline="javascript">
        let fullName, email, phone, address, page;

        $(function () {
            let vars = parseUrl();
            fullName = vars["fullName"] || ""
            email = vars["email"] || ""
            phone = vars["phone"] || ""
            address = vars["address"] || ""
            page = vars["page"] || "1"

            $('#fullName').val(fullName)
            $('#email').val(email)
            $('#phone').val(phone)
            $('#address').val(address)
            $('#page').val(page)

            pagination([[${totalPages}]], [[${currentPage}]]);

            // ===== Quick search box: filter rows in current page bang JS =====
            $('#quickSearchTable').on('input', function () {
                var q = $(this).val().toLowerCase().trim();
                $('#datatable-editable tbody tr').each(function () {
                    var text = $(this).text().toLowerCase();
                    $(this).toggle(q === '' || text.indexOf(q) >= 0);
                });
            });

            // ===== Filter pills: filter by status + role =====
            function applyPill(filter) {
                $('#datatable-editable tbody tr').each(function () {
                    var $row = $(this);
                    var isAdmin = $row.attr('data-is-admin') === 'true';
                    var hasInactiveBadge = $row.find('.status-badge.inactive, .inactive').length > 0;
                    var match = true;
                    if (filter === 'admin') match = isAdmin;
                    else if (filter === 'active') match = !hasInactiveBadge && !isAdmin;
                    else if (filter === 'inactive') match = hasInactiveBadge;
                    $row.toggle(match);
                });
            }
            $('.filter-pill').on('click', function () {
                $('.filter-pill').removeClass('active');
                $(this).addClass('active');
                applyPill($(this).data('filter'));
            });

            // ===== Counter pills =====
            var $rows = $('#datatable-editable tbody tr');
            var cntAll = $rows.length;
            var cntAdmin = $rows.filter('[data-is-admin="true"]').length;
            var cntInactive = $rows.has('.status-badge.inactive, .inactive').length;
            var cntActive = cntAll - cntAdmin - cntInactive;
            $('#cntAll').text(cntAll);
            $('#cntActive').text(cntActive);
            $('#cntInactive').text(cntInactive);
            $('#cntAdmin').text(cntAdmin);
        });

        // Toggle admin role
        $(document).on('click', '.btn-toggle-role', function () {
            const $btn = $(this);
            const userId = $btn.data('user-id');
            const isDemote = $btn.hasClass('demote');
            const actionText = isDemote ? 'thu hồi quyền quản trị viên của' : 'cấp quyền quản trị viên cho';
            if (!confirm('Bạn có chắc muốn ' + actionText + ' tài khoản này?')) return;

            $btn.prop('disabled', true).text('Đang xử lý...');
            $.ajax({
                url: '/api/admin/users/' + userId + '/role',
                type: 'PUT',
                contentType: 'application/json',
                success: function (data) {
                    if (typeof toastr !== 'undefined') toastr.success(data.message);
                    else alert(data.message);
                    setTimeout(function () { location.reload(); }, 500);
                },
                error: function (xhr) {
                    $btn.prop('disabled', false);
                    let msg = 'Có lỗi xảy ra';
                    try { msg = (JSON.parse(xhr.responseText).message) || msg; } catch (e) {}
                    if (typeof toastr !== 'undefined') toastr.error(msg);
                    else alert(msg);
                    location.reload();
                }
            });
        });

        $(document).on('click', '.btn-toggle', function () {
            const $btn = $(this);
            const userId = $btn.data('user-id');
            const currentStatus = $btn.data('current-status') === true || $btn.data('current-status') === 'true';
            const actionText = currentStatus ? 'khóa' : 'mở khóa';
            if (!confirm('Bạn có chắc muốn ' + actionText + ' tài khoản này?')) return;

            $btn.prop('disabled', true).text('Đang xử lý...');
            $.ajax({
                url: '/api/admin/users/' + userId + '/status',
                type: 'PUT',
                contentType: 'application/json',
                success: function (data) {
                    if (typeof toastr !== 'undefined') {
                        toastr.success(data.message || 'Cập nhật thành công');
                    } else {
                        alert(data.message || 'Cập nhật thành công');
                    }
                    setTimeout(function () { location.reload(); }, 500);
                },
                error: function (xhr) {
                    $btn.prop('disabled', false);
                    let msg = 'Có lỗi xảy ra';
                    try {
                        const r = JSON.parse(xhr.responseText);
                        msg = r.message || r.error || msg;
                    } catch (e) {}
                    if (typeof toastr !== 'undefined') {
                        toastr.error(msg);
                    } else {
                        alert(msg);
                    }
                    location.reload();
                }
            });
        });
    </script>
</th:block>
</body>
</html>
