server.port=8081
# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/shoes?useUnicode=yes&characterEncoding=UTF-8&useSSL=false&createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345

# HIBERNATE
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.use-new-id-generator-mappings=false

# Hot reload template
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/

# JWT
jwt.secret=supersecret
jwt.duration=604800

#config upload file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# VNPAY SANDBOX
# Dang ky merchant tai https://sandbox.vnpayment.vn de lay TmnCode + HashSecret rieng.
# Cac gia tri duoi day la placeholder demo, hay thay bang TmnCode/HashSecret cua ban.
vnpay.tmn-code=UFARMUW0
vnpay.hash-secret=IWFUMFVVEE5HNUPB6GDXX6IRLZAAY639
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8081/payment/vnpay/return
vnpay.version=2.1.0
vnpay.command=pay
vnpay.curr-code=VND
vnpay.locale=vn

# MAIL (Gmail SMTP) — dung App Password (https://myaccount.google.com/apppasswords)
# Set bien moi truong MAIL_USERNAME va MAIL_PASSWORD truoc khi chay app
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# https://myaccount.google.com/apppasswords
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OTP config
otp.expiry-minutes=1
otp.resend-cooldown-seconds=60

# GOOGLE OAUTH2 — Lay client-id/client-secret tai https://console.cloud.google.com/apis/credentials
# Authorized redirect URI: http://localhost:8081/login/oauth2/code/google
# Neu chua co cred, default placeholder de Spring khong crash; click Google login se bao loi.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# GROQ CHATBOT
# Khong commit API key. Set bien moi truong GROQ_API_KEY truoc khi chay app.
# Lay API key mien phi tai https://console.groq.com/keys
groq.api-key=${GROQ_API_KEY:}
groq.api-url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
groq.max-tokens=600
groq.temperature=0.5
